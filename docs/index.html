<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Timesheet</title>

  <!-- PWA -->
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#f5f3ef" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#151514" media="(prefers-color-scheme: dark)">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Timesheet">

  <style>
    :root {
      color-scheme: light dark;
      --bg: #f5f3ef;
      --card: #ffffff;
      --text: #1d1c1a;
      --muted: #6e6a63;
      --faint: #aaa59c;
      --line: #e6e2da;
      --chip: #efebe4;
      --chip-press: #e3ded5;
      --accent: #1e6b58;
      --accent-ink: #ffffff;
      --accent-soft: #e2eee9;
      --ok: #2f8a5b;
      --bad: #b3261e;
      --shadow: 0 1px 2px rgba(0,0,0,.04), 0 6px 20px rgba(0,0,0,.05);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #151514;
        --card: #201f1d;
        --text: #f2f0eb;
        --muted: #a6a196;
        --faint: #6d6960;
        --line: #34322e;
        --chip: #2b2a27;
        --chip-press: #363431;
        --accent: #62c3a3;
        --accent-ink: #0c1f19;
        --accent-soft: #1c2f28;
        --ok: #62c3a3;
        --bad: #f2b8b5;
        --shadow: none;
      }
    }
    * { box-sizing: border-box; }
    [hidden], .hidden { display: none !important; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
    button:disabled { opacity: .35; cursor: default; }
    .app {
      max-width: 480px;
      margin: 0 auto;
      padding: calc(10px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom));
    }
    header { display: flex; align-items: center; justify-content: space-between; margin: 2px 0 12px; }
    header h1 { font-size: 24px; margin: 0; letter-spacing: -.015em; }
    .status { font-size: 13px; color: var(--muted); }
    .status::before {
      content: ""; display: inline-block;
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--ok); margin-right: 6px; vertical-align: 1px;
    }
    .status.bad { color: var(--bad); }
    .status.bad::before { background: var(--bad); }
    .icon-btn {
      width: 44px; height: 44px; border-radius: 12px;
      display: grid; place-items: center;
      font-size: 22px; line-height: 1; color: var(--muted);
    }
    .icon-btn:active:not(:disabled) { background: var(--chip); }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 16px;
      box-shadow: var(--shadow);
    }
    .card-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
    .card-head .t { font-weight: 650; font-size: 18px; }
    .card-head .s { color: var(--muted); font-size: 14px; }
    .card-head .h { font-weight: 650; font-variant-numeric: tabular-nums; }

    /* Time tiles: the big number is what people see; a transparent native
       time input sits on top so a tap opens the phone's own picker. */
    .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .tile {
      position: relative;
      background: var(--chip);
      border-radius: 14px;
      padding: 10px 14px;
      min-height: 76px;
      display: flex; flex-direction: column; justify-content: center;
    }
    .tile:active { background: var(--chip-press); }
    .tile .lab { font-size: 13px; color: var(--muted); }
    .tile .val { font-size: 30px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -.01em; line-height: 1.15; }
    .tile .val.empty { color: var(--faint); font-weight: 500; }
    .tile input {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      opacity: 0; margin: 0; padding: 0; border: 0;
      font-size: 16px;
      -webkit-appearance: none; appearance: none;
    }

    .primary {
      width: 100%; margin-top: 12px; min-height: 68px;
      border-radius: 16px;
      background: var(--accent); color: var(--accent-ink);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    }
    .primary b { font-size: 19px; }
    .primary span { font-size: 13px; opacity: .85; font-variant-numeric: tabular-nums; }
    .primary:active { transform: scale(.985); }
    .done-line {
      margin-top: 12px; padding: 14px;
      border-radius: 16px; background: var(--accent-soft);
      text-align: center; font-weight: 600;
    }
    .done-line small { display: block; font-weight: 400; color: var(--muted); font-size: 13px; margin-top: 2px; }

    .fields { display: flex; gap: 12px 16px; margin-top: 16px; align-items: flex-end; flex-wrap: wrap; }
    .field-lab { font-size: 13px; color: var(--muted); margin-bottom: 6px; }
    .chips { display: flex; gap: 6px; }
    .chip { min-height: 40px; padding: 0 14px; border-radius: 999px; background: var(--chip); font-size: 15px; }
    .chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
    .stepper { display: flex; align-items: center; background: var(--chip); border-radius: 999px; }
    .stepper button { width: 42px; height: 40px; border-radius: 999px; font-size: 20px; }
    .stepper button:active { background: var(--chip-press); }
    .stepper .v { min-width: 46px; text-align: center; font-size: 15px; font-variant-numeric: tabular-nums; }

    .month-bar { display: flex; align-items: center; justify-content: space-between; margin: 24px 0 8px; }
    .month-bar .name { font-weight: 650; font-size: 18px; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
    .stat { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 10px 14px; }
    .stat .lab { font-size: 13px; color: var(--muted); }
    .stat .big { font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; }

    .list { background: var(--card); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; box-shadow: var(--shadow); }
    .day {
      display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center;
      width: 100%; text-align: left;
      padding: 10px 16px; min-height: 60px;
      border-top: 1px solid var(--line);
    }
    .day:first-child { border-top: 0; }
    .day:active { background: var(--chip); }
    .day .d { display: flex; flex-direction: column; line-height: 1.1; }
    .day .wd { font-size: 12px; color: var(--muted); }
    .day .n { font-size: 19px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .day .span { display: block; font-variant-numeric: tabular-nums; }
    .day .duty { display: block; font-size: 13px; color: var(--muted); }
    .day .hrs { font-weight: 600; font-variant-numeric: tabular-nums; }
    .day.off { min-height: 44px; }
    .day.off .span, .day.off .n { color: var(--faint); }
    .day.is-today .n { color: var(--accent); }
    .empty-list { padding: 18px; color: var(--muted); text-align: center; }

    dialog {
      border: 0; padding: 0;
      width: 100%; max-width: 480px;
      margin: auto auto 0;
      background: var(--card); color: var(--text);
      border-radius: 22px 22px 0 0;
    }
    dialog::backdrop { background: rgba(0,0,0,.4); }
    .sheet { padding: 10px 16px calc(18px + env(safe-area-inset-bottom)); }
    .grabber { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 12px; }
    .sheet-actions { display: flex; gap: 10px; margin-top: 18px; }
    .sheet-actions button { flex: 1; min-height: 50px; border-radius: 14px; font-weight: 600; }
    .ghost { background: var(--chip); }
    .solid { background: var(--accent); color: var(--accent-ink); }
    .menu-who { font-size: 13px; color: var(--muted); padding: 0 6px 8px; }
    .menu-item { display: block; width: 100%; text-align: left; min-height: 52px; padding: 0 6px; border-top: 1px solid var(--line); font-size: 17px; }

    .toast {
      position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom));
      transform: translate(-50%, 20px);
      opacity: 0; pointer-events: none;
      transition: opacity .18s, transform .18s;
      background: var(--text); color: var(--bg);
      border-radius: 14px; padding: 6px 6px 6px 16px;
      display: flex; align-items: center; gap: 10px;
      width: max-content; max-width: calc(100% - 32px);
      font-size: 15px;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
    .toast button { min-height: 40px; padding: 0 14px; border-radius: 10px; font-weight: 700; color: var(--accent); background: rgba(127,127,127,.18); }
    .toast:not(.has-undo) { padding: 14px 18px; }

    /* Login screen */
    .login { padding-top: calc(48px + env(safe-area-inset-top)); }
    .login h1 { font-size: 24px; margin: 0 0 4px; letter-spacing: -.015em; }
    .login .sub { color: var(--muted); margin-bottom: 14px; }
    .info-banner {
      background: var(--chip);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .field { display: block; margin: 12px 0; }
    .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
    .field input {
      width: 100%; min-height: 48px; padding: 0 14px;
      font: inherit; color: inherit;
      background: var(--chip); border: 1px solid transparent; border-radius: 12px;
    }
    .field input:focus { outline: none; border-color: var(--accent); }
    .login .sheet-actions { margin-top: 16px; }
    .divider {
      display: flex; align-items: center; gap: 10px;
      color: var(--faint); margin: 18px 0 12px; font-size: 14px;
    }
    .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }
    .btn-google {
      width: 100%; min-height: 50px; border-radius: 14px;
      background: var(--chip); font-weight: 600;
      display: flex; gap: 10px; justify-content: center; align-items: center;
    }
    .btn-google svg { width: 18px; height: 18px; }
    .err { color: var(--bad); font-size: 14px; min-height: 1.2em; margin-top: 12px; }
  </style>
</head>

<body>

<!-- ================= LOGIN SCREEN ================= -->
<div class="app login hidden" id="loginScreen">
  <div class="card">
    <h1>Timesheet</h1>
    <div class="sub">Sign in to access your timesheet.</div>

    <div class="info-banner">
      First time signing in? Any timesheet data already on this device will be
      uploaded automatically — nothing gets deleted. After that, your data
      syncs across devices.
    </div>

    <div class="field">
      <label for="loginEmail">Email</label>
      <input id="loginEmail" type="email" autocomplete="email" placeholder="you@example.com">
    </div>
    <div class="field">
      <label for="loginPassword">Password</label>
      <input id="loginPassword" type="password" autocomplete="current-password" placeholder="At least 6 characters">
    </div>

    <div class="sheet-actions">
      <button id="signInBtn" class="solid" type="button">Sign in</button>
      <button id="signUpBtn" class="ghost" type="button">Create account</button>
    </div>

    <div class="divider">or</div>

    <button id="googleBtn" class="btn-google" type="button">
      <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.7-6.1 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.2-.1-2.4-.4-3.5z"/>
        <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.3 19 12 24 12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.4 6.3 14.7z"/>
        <path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.6 39.6 16.2 44 24 44z"/>
        <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.2-4.2 5.6l6.2 5.2c-.4.4 6.7-4.9 6.7-14.8 0-1.2-.1-2.4-.4-3.5z"/>
      </svg>
      Continue with Google
    </button>

    <div class="err" id="loginErr"></div>
  </div>
</div>

<!-- ================= APP SCREEN ================= -->
<div class="app hidden" id="appScreen">
  <header>
    <div>
      <h1>Timesheet</h1>
      <div class="status" id="statusPill">Loading…</div>
    </div>
    <button class="icon-btn" id="menuBtn" type="button" aria-label="More">⋯</button>
  </header>

  <section class="card">
    <div class="card-head">
      <div><div class="t">Today</div><div class="s" id="todayDate"></div></div>
      <div class="h" id="todayHours"></div>
    </div>
    <div id="todayEditor"></div>
    <button class="primary" id="primaryBtn" type="button"><b></b><span></span></button>
    <div class="done-line" id="doneLine" hidden></div>
  </section>

  <div class="month-bar">
    <button class="icon-btn" id="prevMonth" type="button" aria-label="Previous month">‹</button>
    <div class="name" id="monthName"></div>
    <button class="icon-btn" id="nextMonth" type="button" aria-label="Next month">›</button>
  </div>
  <div class="stats">
    <div class="stat"><div class="lab">Total hours</div><div class="big" id="monthTotal"></div></div>
    <div class="stat"><div class="lab">Days worked</div><div class="big" id="monthDays"></div></div>
  </div>
  <div class="list" id="dayList"></div>
</div>

<dialog id="sheet">
  <div class="sheet">
    <div class="grabber"></div>
    <div class="card-head">
      <div class="t" id="sheetTitle"></div>
      <div class="h" id="sheetHours"></div>
    </div>
    <div id="sheetEditor"></div>
    <div class="sheet-actions">
      <button type="button" class="ghost" id="clearDayBtn">Clear day</button>
      <button type="button" class="solid" id="sheetDoneBtn">Done</button>
    </div>
  </div>
</dialog>

<dialog id="menu">
  <div class="sheet">
    <div class="grabber"></div>
    <div class="menu-who">Signed in as <span id="userEmailChip"></span></div>
    <button type="button" class="menu-item" id="exportBtn">Export this month</button>
    <button type="button" class="menu-item" id="resetBtn">Reset this month…</button>
    <button type="button" class="menu-item" id="signOutBtn">Sign out</button>
    <div class="sheet-actions"><button type="button" class="ghost" id="menuCloseBtn">Close</button></div>
  </div>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module">
  // ============================================================
  //  Firebase
  // ============================================================
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import {
    getAuth, onAuthStateChanged,
    signInWithEmailAndPassword, createUserWithEmailAndPassword,
    GoogleAuthProvider, signInWithPopup, signOut
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
  import {
    initializeFirestore, getFirestore,
    persistentLocalCache, persistentMultipleTabManager,
    doc, getDoc, setDoc, onSnapshot, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDislLWIReKRRNEsMKL1Lkcz0Sa5DrkPBw",
    authDomain: "timesheet-pwa-b30e2.firebaseapp.com",
    projectId: "timesheet-pwa-b30e2",
    storageBucket: "timesheet-pwa-b30e2.firebasestorage.app",
    messagingSenderId: "289524739847",
    appId: "1:289524739847:web:f92af2eccb1c8d2a9a1fa2"
  };

  // Allowlisted accounts. Anyone else who signs in is rejected.
  // Mirror this list in Firestore security rules (see README/console).
  const ALLOWED_EMAILS = [
    "wangylhs2@gmail.com",
    "nomi4458898@gmail.com"
  ];

  const fbApp = initializeApp(firebaseConfig);
  const auth = getAuth(fbApp);

  // Firestore with persistent IndexedDB cache (offline-friendly PWA).
  // Falls back to in-memory cache if IndexedDB isn't available (private window etc.).
  let db;
  try {
    db = initializeFirestore(fbApp, {
      localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() })
    });
  } catch {
    db = getFirestore(fbApp);
  }

  // ============================================================
  //  DOM refs — login
  // ============================================================
  const $ = (id) => document.getElementById(id);
  const loginScreen   = $("loginScreen");
  const appScreen     = $("appScreen");
  const emailInput    = $("loginEmail");
  const passwordInput = $("loginPassword");
  const signInBtn     = $("signInBtn");
  const signUpBtn     = $("signUpBtn");
  const googleBtn     = $("googleBtn");
  const loginErr      = $("loginErr");
  const signOutBtn    = $("signOutBtn");
  const userEmailChip = $("userEmailChip");

  // ============================================================
  //  DOM refs — app (timesheet)
  // ============================================================
  const statusPill = $("statusPill");
  const primaryBtn = $("primaryBtn");
  const doneLine   = $("doneLine");
  const dayList    = $("dayList");
  const sheet      = $("sheet");
  const menu       = $("menu");
  const exportBtn  = $("exportBtn");
  const resetBtn   = $("resetBtn");

  // ============================================================
  //  Storage helpers
  //    Local: localStorage keyed "timesheet:v1" (offline cache)
  //    Cloud: Firestore doc users/{email}
  //    Shape: { months: { "YYYY-MM": { rows: [...] } }, monthOrder: [...] }
  // ============================================================
  const STORE_KEY = "timesheet:v1";
  const DUTIES = ["Bake", "Kitchen", "Other"];   // "" means no duty picked
  const MONTH_NAMES = ["January", "February", "March", "April", "May", "June",
                       "July", "August", "September", "October", "November", "December"];

  const fmt2 = (n) => (Math.round(n * 100) / 100).toFixed(2);

  function pad2(n){ return String(n).padStart(2,"0"); }

  function loadStore() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (!raw) return null;
      return JSON.parse(raw);
    } catch { return null; }
  }
  function saveStore(s) {
    localStorage.setItem(STORE_KEY, JSON.stringify(s));
  }

  function ymd(d) {
    return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
  }
  function monthKeyFromDate(d) {
    return `${d.getFullYear()}-${pad2(d.getMonth()+1)}`;
  }
  function daysInMonth(y, m1to12) {
    return new Date(y, m1to12, 0).getDate();
  }
  function weekdayShort(d) {
    return ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][d.getDay()];
  }
  function nowHHMM() {
    const d = new Date();
    return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
  }

  function normalizeTimeString(value) {
    if (value === null || value === undefined) return "";
    const s = String(value).trim();
    if (!s) return "";
    const m = s.match(/^(\d{1,2}):(\d{2})(?::\d{2})?\s*([AaPp][Mm])?$/);
    if (!m) return s;
    let h = Number(m[1]);
    const mm = Number(m[2]);
    const ampm = (m[3] || "").toLowerCase();
    if (!Number.isFinite(h) || !Number.isFinite(mm) || mm < 0 || mm > 59) return s;
    if (ampm) {
      if (h < 1 || h > 12) return s;
      if (ampm === "pm" && h !== 12) h += 12;
      if (ampm === "am" && h === 12) h = 0;
    }
    if (h < 0 || h > 23) return s;
    return `${pad2(h)}:${pad2(mm)}`;
  }

  function toMinutes(hhmm) {
    const n = normalizeTimeString(hhmm);
    if (!n) return null;
    const [h, m] = n.split(":").map(Number);
    if (!Number.isFinite(h) || !Number.isFinite(m)) return null;
    return h * 60 + m;
  }

  function calcHours(startHHMM, endHHMM, lunchHours) {
    const s = toMinutes(startHHMM);
    const e = toMinutes(endHHMM);
    const lunch = Number(lunchHours || 0);
    if (s === null || e === null) return 0;
    let diff = e - s;
    if (diff < 0) diff += 24 * 60; // overnight shift
    const hours = diff / 60 - lunch;
    return hours > 0 ? hours : 0;
  }

  function makeBlankMonth(monthKey) {
    const [yStr, mStr] = monthKey.split("-");
    const y = Number(yStr), m = Number(mStr);
    const n = daysInMonth(y, m);
    const rows = [];
    for (let day = 1; day <= n; day++) {
      const d = new Date(y, m - 1, day);
      rows.push({
        date: ymd(d),
        day: weekdayShort(d),
        start: "",
        end: "",
        duty: "",
        lunch: "0.5",
      });
    }
    return { rows };
  }

  function ensureInit() {
    let s = loadStore();
    if (!s) {
      const mk = monthKeyFromDate(new Date());
      s = { months: {}, monthOrder: [] };
      s.months[mk] = makeBlankMonth(mk);
      s.monthOrder.push(mk);
      saveStore(s);
    }
    return s;
  }

  // ============================================================
  //  State
  //    Rows are addressed as { mk, i } rather than held as objects,
  //    because a cloud snapshot can replace `store` at any moment.
  // ============================================================
  let store = null;          // populated after sign-in
  let viewMonth = null;      // month shown in the list
  let sheetLoc = null;       // row open in the day sheet
  let currentUser = null;
  let userDocRef = null;
  let unsubscribeSnap = null;
  let saveTimer = null;

  function rowAt(loc) {
    return loc && store && store.months[loc.mk] ? store.months[loc.mk].rows[loc.i] : null;
  }

  // Today's month is created in memory when needed. It reaches the cloud
  // with the first edit, so merely opening the app never writes.
  function todayLoc() {
    const d = new Date();
    const mk = monthKeyFromDate(d);
    if (!store.months[mk]) {
      store.months[mk] = makeBlankMonth(mk);
      store.monthOrder.push(mk);
    }
    const rows = store.months[mk].rows;
    let i = rows.findIndex((r) => r.date === ymd(d));
    if (i === -1) {
      rows.push({ date: ymd(d), day: weekdayShort(d), start: "", end: "", duty: "", lunch: "0.5" });
      i = rows.length - 1;
    }
    return { mk, i };
  }

  function sortedMonths() {
    return [...store.monthOrder].sort();
  }

  function setStatus(ok, text) {
    statusPill.textContent = text;
    statusPill.classList.toggle("bad", !ok);
  }

  function commit() {
    persistLocalAndCloud();
    renderAll();
  }

  // ============================================================
  //  Shared editor: Start/End tiles, duty chips, lunch stepper
  // ============================================================
  function makeEditor(root, getRow) {
    root.innerHTML = `
      <div class="tiles">
        <label class="tile"><span class="lab">Start</span><span class="val"></span><input type="time" data-f="start" aria-label="Start time"></label>
        <label class="tile"><span class="lab">End</span><span class="val"></span><input type="time" data-f="end" aria-label="End time"></label>
      </div>
      <div class="fields">
        <div><div class="field-lab">Duty</div><div class="chips"></div></div>
        <div><div class="field-lab">Lunch (hrs)</div>
          <div class="stepper">
            <button type="button" data-step="-1" aria-label="Less lunch">−</button>
            <span class="v"></span>
            <button type="button" data-step="1" aria-label="More lunch">+</button>
          </div>
        </div>
      </div>`;

    const chips = root.querySelector(".chips");
    for (const duty of DUTIES) {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "chip";
      b.textContent = duty;
      b.dataset.duty = duty;
      b.addEventListener("click", () => {
        const row = getRow();
        if (!row) return;
        row.duty = row.duty === duty ? "" : duty;
        commit();
      });
      chips.appendChild(b);
    }

    const inputs = root.querySelectorAll('input[type="time"]');
    for (const input of inputs) {
      const apply = () => {
        const row = getRow();
        if (!row || normalizeTimeString(row[input.dataset.f]) === input.value) return;
        row[input.dataset.f] = input.value;
        commit();
      };
      input.addEventListener("input", apply);
      input.addEventListener("change", apply);
    }

    for (const b of root.querySelectorAll("[data-step]")) {
      b.addEventListener("click", () => {
        const row = getRow();
        if (!row) return;
        const v = Number(row.lunch || 0) + Number(b.dataset.step) * 0.25;
        row.lunch = String(Math.min(3, Math.max(0, v)));
        commit();
      });
    }

    return function render() {
      const row = getRow();
      if (!row) return;
      for (const input of inputs) {
        // Older rows may hold "8:15 AM"; the time input only takes "HH:MM".
        // Normalize for display only, so data changes only where someone edits.
        const v = normalizeTimeString(row[input.dataset.f]);
        const val = input.previousElementSibling;
        val.textContent = v || "--:--";
        val.classList.toggle("empty", !v);
        if (document.activeElement !== input && input.value !== v) input.value = v;
      }
      for (const b of chips.children) b.setAttribute("aria-pressed", String(row.duty === b.dataset.duty));
      root.querySelector(".stepper .v").textContent = Number(row.lunch || 0);
    };
  }

  const renderTodayEditor = makeEditor($("todayEditor"), () => rowAt(todayLoc()));
  const renderSheetEditor = makeEditor($("sheetEditor"), () => rowAt(sheetLoc));
  // On the today card the big button sits right under the times; duty and lunch come after.
  $("todayEditor").querySelector(".tiles").after(primaryBtn, doneLine);

  // ============================================================
  //  Render
  // ============================================================
  function sinceLabel(start) {
    const d = new Date();
    let mins = d.getHours() * 60 + d.getMinutes() - toMinutes(start);
    if (mins < 0) mins += 24 * 60;
    return `${Math.floor(mins / 60)}h ${pad2(mins % 60)}m so far`;
  }

  function renderToday() {
    const d = new Date();
    const row = rowAt(todayLoc());
    const h = calcHours(row.start, row.end, row.lunch);
    $("todayDate").textContent = `${weekdayShort(d)} ${d.getDate()} ${MONTH_NAMES[d.getMonth()].slice(0, 3)}`;
    $("todayHours").textContent = row.start && row.end ? `${fmt2(h)} h` : "";
    renderTodayEditor();

    if (!row.start || !row.end) {
      primaryBtn.hidden = false;
      doneLine.hidden = true;
      primaryBtn.querySelector("b").textContent = row.start ? "Finish work" : "Start work";
      primaryBtn.querySelector("span").textContent = row.start
        ? `now ${nowHHMM()} · ${sinceLabel(row.start)}`
        : `now ${nowHHMM()}`;
    } else {
      primaryBtn.hidden = true;
      doneLine.hidden = false;
      doneLine.innerHTML = `Done for today · ${fmt2(h)} h<small>Tap a time above to correct it</small>`;
    }
  }

  function renderMonth() {
    if (!store.months[viewMonth]) viewMonth = monthKeyFromDate(new Date());
    const month = store.months[viewMonth];
    const [y, m] = viewMonth.split("-").map(Number);
    const today = ymd(new Date());
    $("monthName").textContent = `${MONTH_NAMES[m - 1]} ${y}`;

    let total = 0, days = 0;
    for (const r of month.rows) {
      const h = calcHours(r.start, r.end, r.lunch);
      total += h;
      if (h > 0) days++;
    }
    $("monthTotal").textContent = fmt2(total);
    $("monthDays").textContent = days;

    // Newest first; days that haven't happened yet stay hidden.
    dayList.innerHTML = "";
    const shown = month.rows
      .map((r, i) => ({ r, i }))
      .filter(({ r }) => r.date <= today)
      .reverse();
    for (const { r, i } of shown) {
      const d = new Date(r.date + "T00:00:00");
      const h = calcHours(r.start, r.end, r.lunch);
      const hasTimes = r.start || r.end;
      const b = document.createElement("button");
      b.type = "button";
      b.className = "day" + (hasTimes ? "" : " off") + (r.date === today ? " is-today" : "");
      b.innerHTML = `
        <span class="d"><span class="wd">${weekdayShort(d)}</span><span class="n">${d.getDate()}</span></span>
        <span><span class="span"></span><span class="duty"></span></span>
        <span class="hrs">${h > 0 ? fmt2(h) : ""}</span>`;
      const span = `${normalizeTimeString(r.start) || "--:--"} – ${normalizeTimeString(r.end) || "--:--"}`;
      b.querySelector(".span").textContent = hasTimes ? span : "—";
      b.querySelector(".duty").textContent = r.duty || "";
      b.addEventListener("click", () => openSheet({ mk: viewMonth, i }));
      dayList.appendChild(b);
    }
    if (!shown.length) dayList.innerHTML = `<div class="empty-list">No days yet this month.</div>`;

    const order = sortedMonths();
    const idx = order.indexOf(viewMonth);
    $("prevMonth").disabled = idx <= 0;
    $("nextMonth").disabled = idx >= order.length - 1;
  }

  function renderSheet() {
    const row = rowAt(sheetLoc);
    if (!row) return;
    const d = new Date(row.date + "T00:00:00");
    const h = calcHours(row.start, row.end, row.lunch);
    $("sheetTitle").textContent = `${weekdayShort(d)} ${d.getDate()} ${MONTH_NAMES[d.getMonth()]}`;
    $("sheetHours").textContent = h > 0 ? `${fmt2(h)} h` : "";
    renderSheetEditor();
  }

  function renderAll() {
    if (!store) return;
    renderToday();
    renderMonth();
    renderSheet();
  }

  // ============================================================
  //  Sync — local + Firestore
  // ============================================================
  function persistLocalAndCloud() {
    saveStore(store);                 // immediate local cache
    setStatus(true, "Saved locally");

    if (!userDocRef) return;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(async () => {
      try {
        await setDoc(userDocRef, {
          months: store.months,
          monthOrder: store.monthOrder,
          email: currentUser.email,
          updatedAt: serverTimestamp()
        });
        setStatus(true, "Synced");
      } catch (e) {
        setStatus(false, `Sync failed: ${e.code || e.message}`);
        // Local copy still saved; will retry on next edit.
      }
    }, 500);
  }

  async function loadFromCloud() {
    if (!userDocRef) return;
    setStatus(true, "Loading from cloud…");
    try {
      const snap = await getDoc(userDocRef);
      if (snap.exists()) {
        const data = snap.data();
        store = { months: data.months || {}, monthOrder: data.monthOrder || [] };
        if (!store.monthOrder.length) {
          store = ensureInit();
        }
        saveStore(store);
        setStatus(true, "Loaded");
      } else {
        // First sign-in for this user — push current local data up
        store = ensureInit();
        await setDoc(userDocRef, {
          months: store.months,
          monthOrder: store.monthOrder,
          email: currentUser.email,
          updatedAt: serverTimestamp(),
          createdAt: serverTimestamp()
        });
        setStatus(true, "Initialized");
      }
    } catch (e) {
      // Permission denied = user not on allowlist
      if (e.code === "permission-denied") {
        showLoginError("Your account isn't on the allowlist. Ask the owner to add you.");
        await signOut(auth);
        return;
      }
      setStatus(false, `Load failed: ${e.code || e.message}`);
      // Fall back to local cache so app is still usable
      store = loadStore() || ensureInit();
    }

    viewMonth = monthKeyFromDate(new Date());
    renderAll();
    subscribeRemoteChanges();
  }

  function subscribeRemoteChanges() {
    if (unsubscribeSnap) unsubscribeSnap();
    unsubscribeSnap = onSnapshot(userDocRef, (snap) => {
      if (!snap.exists()) return;
      // Skip our own in-flight writes; the confirmed snapshot will arrive next.
      if (snap.metadata.hasPendingWrites) return;

      const data = snap.data();
      const remote = { months: data.months || {}, monthOrder: data.monthOrder || [] };
      // Re-render only if something actually changed.
      if (JSON.stringify(remote) === JSON.stringify({ months: store.months, monthOrder: store.monthOrder })) return;

      store = remote;
      saveStore(store);
      renderAll();
      setStatus(true, "Updated from cloud");
    }, (err) => {
      setStatus(false, `Sync listener: ${err.code || err.message}`);
    });
  }

  // ============================================================
  //  Today: one tap records the current time
  // ============================================================
  primaryBtn.addEventListener("click", () => {
    const loc = todayLoc();
    const row = rowAt(loc);
    const field = row.start ? "end" : "start";
    const before = row[field];
    const t = nowHHMM();
    row[field] = t;
    commit();
    toast(`${field === "start" ? "Started" : "Finished"} at ${t}`, () => {
      const r = rowAt(loc);
      if (!r) return;
      r[field] = before;
      commit();
    });
  });

  // ============================================================
  //  Month list and day sheet
  // ============================================================
  $("prevMonth").addEventListener("click", () => {
    const order = sortedMonths();
    const idx = order.indexOf(viewMonth);
    if (idx > 0) { viewMonth = order[idx - 1]; renderMonth(); }
  });
  $("nextMonth").addEventListener("click", () => {
    const order = sortedMonths();
    const idx = order.indexOf(viewMonth);
    if (idx < order.length - 1) { viewMonth = order[idx + 1]; renderMonth(); }
  });

  function openSheet(loc) {
    sheetLoc = loc;
    renderSheet();
    sheet.showModal();
  }
  $("sheetDoneBtn").addEventListener("click", () => sheet.close());
  sheet.addEventListener("close", () => { sheetLoc = null; });

  $("clearDayBtn").addEventListener("click", () => {
    const loc = sheetLoc;
    const row = rowAt(loc);
    if (!row) return;
    const before = { start: row.start, end: row.end, duty: row.duty, lunch: row.lunch };
    Object.assign(row, { start: "", end: "", duty: "", lunch: "0.5" });
    sheet.close();
    commit();
    toast("Day cleared", () => {
      const r = rowAt(loc);
      if (!r) return;
      Object.assign(r, before);
      commit();
    });
  });

  // Tap on the dimmed backdrop closes a sheet.
  for (const dlg of [sheet, menu]) {
    dlg.addEventListener("click", (e) => { if (e.target === dlg) dlg.close(); });
  }

  // ============================================================
  //  Menu
  // ============================================================
  $("menuBtn").addEventListener("click", () => menu.showModal());
  $("menuCloseBtn").addEventListener("click", () => menu.close());

  exportBtn.addEventListener("click", async () => {
    menu.close();
    const data = store.months[viewMonth];
    const blob = new Blob([JSON.stringify({ month: viewMonth, ...data }, null, 2)], { type: "application/json" });
    const fileName = `timesheet-${viewMonth}.json`;
    if (navigator.share) {
      try {
        await navigator.share({ title: fileName, text: "Timesheet export", files: [new File([blob], fileName, { type: "application/json" })] });
        setStatus(true, "Exported");
        return;
      } catch {}
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = fileName;
    a.click();
    URL.revokeObjectURL(url);
    setStatus(true, "Exported");
  });

  resetBtn.addEventListener("click", () => {
    menu.close();
    const mk = viewMonth;
    const [y, m] = mk.split("-").map(Number);
    if (!confirm(`Clear every day in ${MONTH_NAMES[m - 1]} ${y}?`)) return;
    const before = store.months[mk];
    store.months[mk] = makeBlankMonth(mk);
    commit();
    toast("Month cleared", () => {
      store.months[mk] = before;
      commit();
    });
  });

  // ============================================================
  //  Toast with undo
  // ============================================================
  let toastTimer = null;
  function toast(message, undo) {
    const el = $("toast");
    el.innerHTML = "";
    const span = document.createElement("span");
    span.textContent = message;
    el.appendChild(span);
    el.classList.toggle("has-undo", Boolean(undo));
    if (undo) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = "Undo";
      b.addEventListener("click", () => { hideToast(); undo(); });
      el.appendChild(b);
    }
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hideToast, 6000);
  }
  function hideToast() { $("toast").classList.remove("show"); }

  // Keep "now 08:07" honest, and roll over to a new day at midnight.
  let lastDay = ymd(new Date());
  setInterval(() => {
    if (!store) return;
    const d = ymd(new Date());
    if (d !== lastDay) {
      lastDay = d;
      viewMonth = monthKeyFromDate(new Date());
      renderAll();
    } else {
      renderToday();
    }
  }, 10000);

  // ============================================================
  //  Auth UI
  // ============================================================
  function showLoginError(msg) {
    loginErr.textContent = msg || "";
  }
  function clearLoginError() { loginErr.textContent = ""; }

  function showLogin() {
    if (sheet.open) sheet.close();
    if (menu.open) menu.close();
    hideToast();
    loginScreen.classList.remove("hidden");
    appScreen.classList.add("hidden");
    passwordInput.value = "";
  }
  function showApp(user) {
    loginScreen.classList.add("hidden");
    appScreen.classList.remove("hidden");
    userEmailChip.textContent = user.email || "";
    clearLoginError();
  }

  function isAllowed(email) {
    return email && ALLOWED_EMAILS.includes(email.toLowerCase());
  }

  function friendlyAuthError(e) {
    const code = e?.code || "";
    if (code === "auth/invalid-credential" || code === "auth/wrong-password" || code === "auth/user-not-found") {
      return "Email or password is incorrect.";
    }
    if (code === "auth/email-already-in-use") return "An account with that email already exists. Try Sign in.";
    if (code === "auth/weak-password") return "Password must be at least 6 characters.";
    if (code === "auth/invalid-email") return "That email doesn't look right.";
    if (code === "auth/popup-closed-by-user") return "Google sign-in was cancelled.";
    if (code === "auth/popup-blocked") return "Your browser blocked the Google sign-in popup. Allow popups and try again.";
    if (code === "auth/network-request-failed") return "Network error. Check your connection and try again.";
    return e?.message || "Sign-in failed.";
  }

  signInBtn.addEventListener("click", async () => {
    clearLoginError();
    const email = emailInput.value.trim();
    const password = passwordInput.value;
    if (!email || !password) { showLoginError("Enter email and password."); return; }
    if (!isAllowed(email)) {
      showLoginError("This email isn't on the allowlist.");
      return;
    }
    signInBtn.disabled = true; signUpBtn.disabled = true; googleBtn.disabled = true;
    try {
      await signInWithEmailAndPassword(auth, email, password);
    } catch (e) {
      showLoginError(friendlyAuthError(e));
    } finally {
      signInBtn.disabled = false; signUpBtn.disabled = false; googleBtn.disabled = false;
    }
  });

  signUpBtn.addEventListener("click", async () => {
    clearLoginError();
    const email = emailInput.value.trim();
    const password = passwordInput.value;
    if (!email || !password) { showLoginError("Enter email and password."); return; }
    if (!isAllowed(email)) {
      showLoginError("This email isn't on the allowlist.");
      return;
    }
    signInBtn.disabled = true; signUpBtn.disabled = true; googleBtn.disabled = true;
    try {
      await createUserWithEmailAndPassword(auth, email, password);
    } catch (e) {
      showLoginError(friendlyAuthError(e));
    } finally {
      signInBtn.disabled = false; signUpBtn.disabled = false; googleBtn.disabled = false;
    }
  });

  googleBtn.addEventListener("click", async () => {
    clearLoginError();
    googleBtn.disabled = true; signInBtn.disabled = true; signUpBtn.disabled = true;
    try {
      const provider = new GoogleAuthProvider();
      await signInWithPopup(auth, provider);
      // onAuthStateChanged will handle the rest, including allowlist check.
    } catch (e) {
      showLoginError(friendlyAuthError(e));
    } finally {
      googleBtn.disabled = false; signInBtn.disabled = false; signUpBtn.disabled = false;
    }
  });

  signOutBtn.addEventListener("click", async () => {
    menu.close();
    if (unsubscribeSnap) { unsubscribeSnap(); unsubscribeSnap = null; }
    await signOut(auth);
  });

  // Press Enter in either login field → trigger Sign in
  for (const el of [emailInput, passwordInput]) {
    el.addEventListener("keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); signInBtn.click(); }
    });
  }

  // ============================================================
  //  Auth state — main entry point
  // ============================================================
  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      currentUser = null;
      userDocRef = null;
      store = null;
      viewMonth = null;
      sheetLoc = null;
      if (unsubscribeSnap) { unsubscribeSnap(); unsubscribeSnap = null; }
      showLogin();
      return;
    }

    // Block users not on the allowlist (UX layer; rules enforce server-side).
    if (!isAllowed(user.email)) {
      showLoginError("Your account isn't on the allowlist. Ask the owner to add you.");
      await signOut(auth);
      return;
    }

    currentUser = user;
    // Doc keyed by email so Google + email/password sign-in for the same
    // person hit the same data (different auth providers produce different UIDs).
    userDocRef = doc(db, "users", user.email.toLowerCase());
    showApp(user);
    await loadFromCloud();
  });

  // ============================================================
  //  Service worker
  // ============================================================
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    });
  }
</script>
</body>
</html>
